<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Neon sign reading Afro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="wall" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#07060d"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="A" d="M150 215 L200 85 L250 215 M165 172 H235"/>
    <path id="f" d="M318 215 V112 C318 88 340 82 358 92 M294 137 H346"/>
    <path id="r" d="M392 215 V125 M392 162 C392 135 418 122 442 128"/>
    <ellipse id="o" cx="512" cy="170" rx="46" ry="45"/>
  </defs>

  <rect width="800" height="300" rx="18" fill="url(#wall)"/>
  <rect x="14" y="14" width="772" height="272" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <g transform="translate(47 0)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- A : pink -->
    <g>
      <g stroke="#ff2bd6" stroke-width="14" filter="url(#glow)"><use href="#A" xlink:href="#A"/></g>
      <g stroke="#ffd6f7" stroke-width="4"><use href="#A" xlink:href="#A"/></g>
    </g>

    <!-- f : cyan -->
    <g>
      <g stroke="#19f3ff" stroke-width="14" filter="url(#glow)"><use href="#f" xlink:href="#f"/></g>
      <g stroke="#d8fdff" stroke-width="4"><use href="#f" xlink:href="#f"/></g>
    </g>

    <!-- r : pink, flickers -->
    <g>
      <g stroke="#ff2bd6" stroke-width="14" filter="url(#glow)"><use href="#r" xlink:href="#r"/></g>
      <g stroke="#ffd6f7" stroke-width="4"><use href="#r" xlink:href="#r"/></g>
      <animate attributeName="opacity"
               values="1;1;0.9;1;0.3;1;0.65;1;1"
               keyTimes="0;0.55;0.57;0.6;0.62;0.65;0.67;0.7;1"
               dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- o : cyan -->
    <g>
      <g stroke="#19f3ff" stroke-width="14" filter="url(#glow)"><use href="#o" xlink:href="#o"/></g>
      <g stroke="#d8fdff" stroke-width="4"><use href="#o" xlink:href="#o"/></g>
    </g>
  </g>
</svg>
